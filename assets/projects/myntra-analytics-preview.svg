  <line x1="52" y1="520" x2="1148" y2="520" stroke="#dfe3e9"/>
  <text x="52" y="562" fill="#626975" font-family="Inter, Arial, sans-serif" font-size="14">Content format</text>
  <text x="1148" y="562" text-anchor="end" fill="#626975" font-family="Inter, Arial, sans-serif" font-size="14">Source: workbook chart · Average engagement rate and clicks</text>
