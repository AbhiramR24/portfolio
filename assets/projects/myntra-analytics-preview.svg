<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 660" role="img" aria-labelledby="title description">
  <title id="title">Myntra social media post performance</title>
  <desc id="description">Workbook chart values comparing average engagement rate and average clicks for carousel, image, and video posts.</desc>
  <rect width="1200" height="660" rx="20" fill="#f7f8fa"/>
  <text x="52" y="64" fill="#17191e" font-family="Inter, Arial, sans-serif" font-size="27" font-weight="700">Post type performance</text>
